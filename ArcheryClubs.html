<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archery Clubs Map - Imperial Challenge</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <link rel="stylesheet" href="./css/imperial-challenge.css">
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; }

    .map-app {
      flex: 1;
      display: flex;
      min-height: 0;
      overflow: hidden;
    }

    /* ---------- Sidebar ---------- */
    .map-sidebar {
      width: 340px;
      min-width: 340px;
      background: #f8f9fa;
      border-right: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .map-sidebar-header {
      background: linear-gradient(135deg, #4a5c8c 0%, #3d4d73 100%);
      color: white;
      padding: 1rem 1.2rem;
      border-bottom: 3px solid #e91e63;
    }

    .map-sidebar-header h2 {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 0 0 0.2rem;
    }

    .map-sidebar-header .count {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.8);
    }

    .map-sidebar-header .count b { color: #ffd700; }

    .map-hint {
      padding: 0.7rem 1rem;
      font-size: 0.8rem;
      color: #666;
      border-bottom: 1px solid #e0e0e0;
      background: #fff;
    }

    .club-list {
      list-style: none;
      margin: 0;
      padding: 0.3rem;
      overflow-y: auto;
      flex: 1;
    }

    .club-item {
      display: flex;
      align-items: flex-start;
      gap: 0.7rem;
      padding: 0.65rem 0.7rem;
      border-radius: 7px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .club-item:hover { background: rgba(74, 92, 140, 0.1); }

    .club-item.active { background: #4a5c8c; }
    .club-item.active .club-name { color: white; }
    .club-item.active .club-addr { color: rgba(255,255,255,0.75); }
    .club-item.active .club-num { color: #ffd700; }

    .club-num {
      font-family: monospace;
      font-size: 0.72rem;
      color: #999;
      min-width: 1.6rem;
      padding-top: 0.15rem;
    }

    .club-name {
      font-weight: 600;
      font-size: 0.92rem;
      color: #333;
      margin: 0 0 0.15rem;
    }

    .club-addr {
      font-size: 0.76rem;
      color: #666;
      line-height: 1.35;
    }

    /* ---------- Map ---------- */
    #map {
      flex: 1;
      height: 100%;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 8px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    }

    .popup-name {
      font-weight: 700;
      font-size: 1rem;
      color: #4a5c8c;
      margin: 0 0 0.25rem;
    }

    .popup-addr {
      font-size: 0.8rem;
      color: #666;
      line-height: 1.4;
    }

    .target-marker {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .target-marker svg { filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3)); }

    .club-list::-webkit-scrollbar { width: 8px; }
    .club-list::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 4px; }

    @media (max-width: 768px) {
      .map-sidebar { width: 220px; min-width: 220px; }
    }

    @media (max-width: 540px) {
      .map-app { flex-direction: column; }
      .map-sidebar { width: 100%; min-width: 0; height: 220px; }
      #map { min-height: 55vh; }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="logo-container">
    <a href="https://www.osarchers.co.uk" target="_blank">
      <img src="img/OSA%20logo@2x.png" alt="OS Archers Logo" class="logo">
    </a>
  </div>
  <h1>Archery Clubs Map</h1>
  <nav class="nav-links">
    <a href="index.html">Home</a>
    <a href="enter.html">Enter</a>
    <a href="scores.html">Submit Scores</a>
    <a href="myscores.html">My Scores</a>
    <a href="ICRounds.html">Imperial Rounds</a>
    <a href="ArcheryClubs.html">Clubs Map</a>
  </nav>
</header>

<div class="map-app">
  <div class="map-sidebar">
    <div class="map-sidebar-header">
      <h2>Archery Clubs</h2>
      <div class="count"><b id="club-count">0</b> clubs mapped &middot; UK &amp; Channel Islands</div>
    </div>
    <div class="map-hint">Click a club to centre the map and view its details.</div>
    <ul class="club-list" id="club-list"></ul>
  </div>
  <div id="map"></div>
</div>

<footer class="footer">
  <p>&copy; 2026 Ordnance Survey Archers. Founded 2019.</p>
  <p><a href="https://www.osarchers.co.uk">Visit our main website</a></p>
</footer>

<script>
  const clubs = [
    { name: "OS Archers", venue: "Ordnance Survey Archers", address: "Adanac Dr, Nursling, Southampton SO16 0AS", lat: 50.9378972, lng: -1.4692141 },
    { name: "Southampton Archery Club", venue: "Hardmoor Sports Ground", address: "Stoneham Lane, Eastleigh SO50 9HT", lat: 50.9505396, lng: -1.3823891 },
    { name: "Overton Black Arrows", venue: "Overton Black Arrows", address: "Laverstoke, Whitchurch RG28 7NY", lat: 51.2328620, lng: -1.2991839 },
    { name: "Waterside Archers", venue: "Exbury Range", address: "Summer Ln, Southampton SO45 1AZ", lat: 50.8071124, lng: -1.4026624 },
    { name: "Southend District", venue: "Southend and District Archery Club", address: "Clements Hall Way, Hawkwell, Hockley SS5 4LN", lat: 51.5946757, lng: 0.6721935 },
    { name: "Kirton in Lindsey", venue: "Kirton In Lindsey Archery Club", address: "KLASSIC Park Fields, Ings Rd, Kirton in Lindsey, Gainsborough DN21 4BX", lat: 53.4769300, lng: -0.6034990 },
    { name: "Devizes Bowmen", venue: "Devizes Bowmen", address: "Green Lane Playing Fields, Devizes SN10 5DS", lat: 51.3367558, lng: -1.9818091 },
    { name: "Brent Valley Archers / Rickmansworth Archery Club", venue: "Brent Valley Archers", address: "Perivale Community Centre, Horsenden Ln S, Greenford UB6 7NP", lat: 51.5410685, lng: -0.3251656 },
    { name: "Andover Archers", venue: "Andover Archery Club", address: "Foxcotte Ln, Andover SP11 0TA", lat: 51.2328354, lng: -1.4991081 },
    { name: "Forest of Bere Bowmen", venue: "Forest of Bere Archery", address: "Blendworth Ln, Horndean, Waterlooville PO8 0DG", lat: 50.9122665, lng: -0.9905347 },
    { name: "Bowmen of Guernsey", venue: "Bowmen of Guernsey", address: "Guernsey GY6", lat: 49.4853232, lng: -2.5818153 },
    { name: "Bath Archers", venue: "Bath Archers", address: "London Rd W, Bath BA1 7DD", lat: 51.4001545, lng: -2.3286524 },
    { name: "Talisman Bowmen", venue: "Talisman Bowmen Outdoor Range", address: "345b Hunts Pond Rd, Park Gate, Fareham PO14 4PD", lat: 50.8539060, lng: -1.2526140 },
    { name: "Evesham Archery Club", venue: "Evesham Archery Club", address: "Brewers Ln, Badsey, Evesham WR11 7EU", lat: 52.0891132, lng: -1.8891031 },
    { name: "Perth Archery Club", venue: "Doo'cot Park (outdoor range)", address: "Pitcullen Cres, Perth PH2 7HU", lat: 56.4065723, lng: -3.4210769 },
    { name: "Clophill Archery Club", venue: "Clophill Archery Club", address: "Clophill, Bedford MK45 4DA", lat: 52.0321026, lng: -0.4204501 },
    { name: "Towcester Archers", venue: "Towcester Archers", address: "Greens, Norton Road, Towcester NN12 8AW", lat: 52.1415246, lng: -1.0063796 },
    { name: "Bowmen of Lytchett", venue: "The Bowmen Of Lytchett Archery Club", address: "Worgret Rd, Wareham BH20 4PH", lat: 50.6818963, lng: -2.1215863 },
    { name: "Stalybridge Archery Club", venue: "Stalybridge Archery Club", address: "Mottram Rd, Stalybridge SK15 2QS", lat: 53.4779847, lng: -2.0448142 },
    { name: "Ham and Petersham", venue: "Ham & Petersham Rifle & Pistol Club", address: "The Ranges, Ham St, Richmond TW10 7RT", lat: 51.4431587, lng: -0.3210282 }
  ];

  document.getElementById('club-count').textContent = clubs.length;

  const map = L.map('map', { zoomControl: true }).setView([52.6, -1.8], 6);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  function targetIcon(active) {
    const ring  = active ? '#e91e63' : '#4a5c8c';
    const dot   = active ? '#ffd700' : '#e91e63';
    const fill  = active ? '#fff'    : '#f8f9fa';
    return L.divIcon({
      className: 'target-marker',
      html: `<svg width="28" height="28" viewBox="0 0 28 28">
               <circle cx="14" cy="14" r="12" fill="${fill}" stroke="${ring}" stroke-width="2.5"/>
               <circle cx="14" cy="14" r="7.5" fill="none" stroke="${ring}" stroke-width="2"/>
               <circle cx="14" cy="14" r="3" fill="${dot}"/>
             </svg>`,
      iconSize: [28, 28],
      iconAnchor: [14, 14],
      popupAnchor: [0, -12]
    });
  }

  const markers = [];
  const listEl = document.getElementById('club-list');

  clubs.forEach((club, i) => {
    const marker = L.marker([club.lat, club.lng], { icon: targetIcon(false) }).addTo(map);
    marker.bindPopup(
      `<div class="popup-name">${club.name}</div>
       <div class="popup-addr">${club.venue}<br>${club.address}</div>`
    );
    markers.push(marker);

    const li = document.createElement('li');
    li.className = 'club-item';
    li.id = 'item-' + i;
    li.innerHTML = `
      <span class="club-num">${String(i + 1).padStart(2, '0')}</span>
      <div>
        <p class="club-name">${club.name}</p>
        <p class="club-addr">${club.address}</p>
      </div>`;
    li.addEventListener('click', () => focusClub(i));
    listEl.appendChild(li);

    marker.on('click', () => focusClub(i));
  });

  let activeIndex = null;
  function focusClub(i) {
    if (activeIndex !== null) {
      markers[activeIndex].setIcon(targetIcon(false));
      document.getElementById('item-' + activeIndex).classList.remove('active');
    }
    activeIndex = i;
    markers[i].setIcon(targetIcon(true));
    document.getElementById('item-' + i).classList.add('active');
    map.flyTo(markers[i].getLatLng(), 12, { duration: 0.6 });
    markers[i].openPopup();
    document.getElementById('item-' + i).scrollIntoView({ block: 'nearest' });
  }

  const group = L.featureGroup(markers);
  map.fitBounds(group.getBounds().pad(0.15));
</script>

</body>
</html>
