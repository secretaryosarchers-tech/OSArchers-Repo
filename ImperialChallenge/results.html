<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imperial Challenge 2026 - Round Results</title>
  <link rel="stylesheet" href="css/imperial-challenge.css">
  <style>
    /* ---- Filters ---- */
    .filter-bar {
      background: white;
      border-radius: 15px;
      padding: 22px 28px;
      margin-bottom: 28px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      align-items: flex-end;
    }
    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 170px;
    }
    .filter-group label {
      font-size: 0.8em;
      font-weight: 700;
      color: #4a5c8c;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    .filter-group select {
      padding: 9px 13px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 0.93em;
      color: #333;
      background: #f8f9fa;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .filter-group select:focus { outline: none; border-color: #4a5c8c; }
    .filter-reset {
      padding: 9px 18px;
      background: #f8f9fa;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      color: #666;
      font-size: 0.93em;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-reset:hover { border-color: #4a5c8c; color: #4a5c8c; }

    /* ---- Round sections ---- */
    .round-section {
      background: white;
      border-radius: 15px;
      margin-bottom: 30px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    .round-header {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 20px 28px;
      background: linear-gradient(135deg, #eef1fb, #e2e7f7);
      border-bottom: 3px solid #4a5c8c;
    }
    .round-header h2 { margin: 0; font-size: 1.4em; color: #333652; }
    .round-header .round-count { font-size: 0.85em; color: #777; }

    .round-body { padding: 8px 28px 24px; }

    /* ---- Category blocks ---- */
    .category-block {
      margin-top: 20px;
      border: 1px solid #eee;
      border-radius: 12px;
      overflow: hidden;
    }
    .category-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 12px 18px;
      background: #fafafa;
      border-bottom: 1px solid #eee;
    }
    .category-heading .cat-name {
      font-weight: 700;
      color: #4a5c8c;
      font-size: 1em;
    }
    .category-heading .cat-count { font-size: 0.8em; color: #999; }

    /* ---- Podium (top 3) ---- */
    .podium {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      padding: 14px 18px;
    }
    .podium-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 10px;
      background: #fafafa;
      border: 2px solid transparent;
    }
    .podium-card.rank1 { background: linear-gradient(135deg, #FFF8DC, #FFF0A0); border-color: #DAA520; }
    .podium-card.rank2 { background: linear-gradient(135deg, #F5F5F5, #E8E8E8); border-color: #A0A0A0; }
    .podium-card.rank3 { background: linear-gradient(135deg, #FFF0E6, #FFE0C0); border-color: #CD7F32; }
    .podium-medal { font-size: 1.6em; flex-shrink: 0; }
    .podium-info { flex: 1; min-width: 0; }
    .podium-name {
      font-weight: 700;
      color: #333;
      font-size: 0.98em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .podium-club { font-size: 0.78em; color: #888; }
    .podium-score {
      font-weight: 800;
      font-size: 1.2em;
      color: #4a5c8c;
      flex-shrink: 0;
    }

    /* ---- Rest of the field ---- */
    .rest-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92em;
    }
    .rest-table th {
      text-align: left;
      padding: 8px 18px;
      color: #888;
      font-size: 0.8em;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      border-top: 1px solid #f0f0f0;
    }
    .rest-table td {
      padding: 7px 18px;
      border-top: 1px solid #f5f5f5;
    }
    .rest-table td.rank-col { color: #999; width: 40px; }
    .rest-table td.score-col { text-align: right; font-weight: 700; color: #4a5c8c; }
    .rest-table tr:hover td { background: #fafeff; }

    /* ---- Empty / loading ---- */
    .empty-notice {
      padding: 40px;
      text-align: center;
      color: #999;
      font-style: italic;
    }
    .loading-state { text-align: center; padding: 60px 20px; color: #888; font-size: 1.05em; }
    .loading-spinner {
      width: 38px; height: 38px;
      border: 4px solid #e0e0e0;
      border-top-color: #4a5c8c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header class="header">
  <div class="logo-container">
    <a href="https://www.osarchers.co.uk" target="_blank">
      <img src="img/OSA%20logo@2x.png" alt="OS Archers Logo" class="logo">
    </a>
  </div>
  <h1>Round Results</h1>
</header>

<div class="container">
  <div class="hero">
    <h1>Round Results</h1>
    <p class="subtitle">Imperial Challenge 2026</p>
    <p style="color:#666;">Every round shot, broken down by bow style, gender and age group &mdash; top 3 in each category earn Gold, Silver and Bronze</p>
  </div>

  <!-- Login -->
  <div id="loginSection" class="content-section">
    <h2>Access Required</h2>
    <div style="max-width:400px; margin:30px auto;">
      <p style="color:#666; margin-bottom:20px;">This page is password protected.</p>
      <input type="password" id="pagePassword" placeholder="Enter password"
             style="width:100%; padding:15px; font-size:16px; border:2px solid #e0e0e0; border-radius:8px; margin-bottom:16px;">
      <button id="loginBtn" class="cta-button" style="width:100%;">View Results</button>
      <div id="loginMessage" style="margin-top:14px; padding:10px; border-radius:6px; display:none;"></div>
    </div>
  </div>

  <!-- Main content (hidden until login) -->
  <div id="resultsContent" style="display:none;">

    <!-- Filters -->
    <div class="filter-bar">
      <div class="filter-group">
        <label>Round</label>
        <select id="filterRound">
          <option value="">All Rounds</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Gender</label>
        <select id="filterGender">
          <option value="">All Genders</option>
          <option value="Gent">Gent</option>
          <option value="Lady">Lady</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Age Group</label>
        <select id="filterAgeGroup">
          <option value="">All Ages</option>
          <option value="Senior">Senior</option>
          <option value="Junior">Junior</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Bow Style</label>
        <select id="filterBow">
          <option value="">All Bow Styles</option>
          <option value="Recurve">Recurve</option>
          <option value="Compound">Compound</option>
          <option value="Barebow">Barebow</option>
          <option value="Longbow">Longbow</option>
          <option value="Traditional">Traditional</option>
        </select>
      </div>
      <button class="filter-reset" id="resetFilters">Reset Filters</button>
    </div>

    <!-- Loading indicator -->
    <div id="loadingState" class="content-section">
      <div class="loading-spinner"></div>
      <div>Loading results&hellip;</div>
    </div>

    <!-- Rounds render here -->
    <div id="roundsContainer"></div>

  </div><!-- /resultsContent -->
</div>

<footer class="footer">
  <p>&copy; 2026 Ordnance Survey Archers. Founded 2019.</p>
</footer>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
  import { getFirestore, collection, getDocs, orderBy, query } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: "AIzaSyBiXcIHedwHbD7SVpTedQPH9UxJaVSD9Jo",
    authDomain: "osmembership-bc876.firebaseapp.com",
    projectId: "osmembership-bc876",
    storageBucket: "osmembership-bc876.firebasestorage.app",
    messagingSenderId: "265215395375",
    appId: "1:265215395375:web:2523ab3fefa6f27fafe8da",
    measurementId: "G-7Q3KXJ4MYS"
  };

  const PAGE_PASSWORD = "imperial2026";

  // Preferred display order; anything else discovered in the data is appended alphabetically
  const BOW_ORDER = ['Recurve', 'Compound', 'Barebow', 'Longbow', 'Traditional'];
  const CATEGORY_ORDER = ['Gent', 'Lady', 'Junior Gent', 'Junior Lady'];

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  let allScores = [];

  // ---- Login ----
  function login() {
    const pwd = document.getElementById('pagePassword').value;
    const msg = document.getElementById('loginMessage');
    if (pwd === PAGE_PASSWORD) {
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('resultsContent').style.display = 'block';
      loadScores();
    } else {
      msg.textContent = 'Incorrect password. Please try again.';
      msg.style.cssText = 'display:block; background:#f8d7da; color:#721c24; padding:10px; border-radius:6px;';
      document.getElementById('pagePassword').value = '';
      document.getElementById('pagePassword').focus();
    }
  }
  document.getElementById('loginBtn').addEventListener('click', login);
  document.getElementById('pagePassword').addEventListener('keypress', e => { if (e.key === 'Enter') login(); });

  // ---- Load ----
  async function loadScores() {
    try {
      const snap = await getDocs(query(collection(db, 'imperialChallengeScores'), orderBy('timestamp', 'asc')));
      allScores = [];
      snap.forEach(doc => allScores.push({ id: doc.id, ...doc.data() }));
      document.getElementById('loadingState').style.display = 'none';
      populateRoundFilter();
      wireFilters();
      renderAll();
    } catch (e) {
      console.error(e);
      document.getElementById('loadingState').innerHTML = '<p style="color:#c00;">Error loading results: ' + esc(e.message) + '</p>';
    }
  }

  function populateRoundFilter() {
    const rounds = [...new Set(allScores.map(s => s.round).filter(Boolean))].sort();
    const select = document.getElementById('filterRound');
    rounds.forEach(r => {
      const opt = document.createElement('option');
      opt.value = r;
      opt.textContent = r;
      select.appendChild(opt);
    });
  }

  // ---- Filters ----
  function wireFilters() {
    ['filterRound', 'filterGender', 'filterAgeGroup', 'filterBow'].forEach(id => {
      document.getElementById(id).addEventListener('change', renderAll);
    });
    document.getElementById('resetFilters').addEventListener('click', () => {
      document.getElementById('filterRound').value = '';
      document.getElementById('filterGender').value = '';
      document.getElementById('filterAgeGroup').value = '';
      document.getElementById('filterBow').value = '';
      renderAll();
    });
  }

  function genderOf(category) { return (category || '').includes('Lady') ? 'Lady' : 'Gent'; }
  function ageGroupOf(category) { return (category || '').includes('Junior') ? 'Junior' : 'Senior'; }

  function getFiltered() {
    const round = document.getElementById('filterRound').value;
    const gender = document.getElementById('filterGender').value;
    const ageGroup = document.getElementById('filterAgeGroup').value;
    const bow = document.getElementById('filterBow').value;
    return allScores.filter(s => {
      if (round && s.round !== round) return false;
      if (gender && genderOf(s.category) !== gender) return false;
      if (ageGroup && ageGroupOf(s.category) !== ageGroup) return false;
      if (bow && s.bowType !== bow) return false;
      return true;
    });
  }

  // ---- Group: round -> best score per archer ----
  function groupByRound(scores) {
    const rounds = new Map();
    scores.forEach(s => {
      if (!s.round) return;
      const key = (s.agbNumber || s.archerName || '').trim().toLowerCase();
      if (!key) return;
      if (!rounds.has(s.round)) rounds.set(s.round, new Map());
      const archers = rounds.get(s.round);
      const existing = archers.get(key);
      if (!existing || s.totalScore > existing.totalScore) {
        archers.set(key, s);
      }
    });
    return rounds;
  }

  // ---- Group: category (bow + gender/age) -> ranked entries ----
  function groupByCategory(entries) {
    const cats = new Map();
    entries.forEach(s => {
      const catKey = (s.category || 'Unknown') + '|' + (s.bowType || 'Unknown');
      if (!cats.has(catKey)) cats.set(catKey, []);
      cats.get(catKey).push(s);
    });
    cats.forEach(list => list.sort((a, b) => b.totalScore - a.totalScore));
    return cats;
  }

  function sortIndex(arr, value) {
    const i = arr.indexOf(value);
    return i === -1 ? arr.length : i;
  }

  // ---- Render ----
  function renderAll() {
    const filtered = getFiltered();
    const rounds = groupByRound(filtered);
    const container = document.getElementById('roundsContainer');

    if (rounds.size === 0) {
      container.innerHTML = '<div class="round-section"><div class="empty-notice">No scores match the current filters.</div></div>';
      return;
    }

    const roundNames = [...rounds.keys()].sort();

    container.innerHTML = roundNames.map(roundName => {
      const entries = [...rounds.get(roundName).values()];
      const cats = groupByCategory(entries);

      const catKeys = [...cats.keys()].sort((a, b) => {
        const [catA, bowA] = a.split('|');
        const [catB, bowB] = b.split('|');
        const bi = sortIndex(BOW_ORDER, bowA) - sortIndex(BOW_ORDER, bowB);
        if (bi !== 0) return bi;
        return sortIndex(CATEGORY_ORDER, catA) - sortIndex(CATEGORY_ORDER, catB);
      });

      const categoryBlocks = catKeys.map(catKey => {
        const [category, bowType] = catKey.split('|');
        const list = cats.get(catKey);
        const top3 = list.slice(0, 3);
        const rest = list.slice(3);

        const medals = ['&#129351;', '&#129352;', '&#129353;'];
        const rankClasses = ['rank1', 'rank2', 'rank3'];

        const podiumHtml = top3.map((s, idx) => `
          <div class="podium-card ${rankClasses[idx]}">
            <span class="podium-medal">${medals[idx]}</span>
            <span class="podium-info">
              <div class="podium-name">${esc(s.archerName)}</div>
              <div class="podium-club">${esc(s.club || '')}</div>
            </span>
            <span class="podium-score">${s.totalScore}</span>
          </div>`).join('');

        const restHtml = rest.length ? `
          <table class="rest-table">
            <thead><tr><th>#</th><th>Name</th><th>Club</th><th style="text-align:right;">Score</th></tr></thead>
            <tbody>
              ${rest.map((s, idx) => `
                <tr>
                  <td class="rank-col">${idx + 4}</td>
                  <td>${esc(s.archerName)}</td>
                  <td>${esc(s.club || '')}</td>
                  <td class="score-col">${s.totalScore}</td>
                </tr>`).join('')}
            </tbody>
          </table>` : '';

        return `
          <div class="category-block">
            <div class="category-heading">
              <span class="cat-name">${esc(bowType)} &middot; ${esc(category)}</span>
              <span class="cat-count">${list.length} archer${list.length === 1 ? '' : 's'}</span>
            </div>
            <div class="podium">${podiumHtml}</div>
            ${restHtml}
          </div>`;
      }).join('');

      return `
        <div class="round-section">
          <div class="round-header">
            <h2>${esc(roundName)}</h2>
            <span class="round-count">${entries.length} archer${entries.length === 1 ? '' : 's'}</span>
          </div>
          <div class="round-body">${categoryBlocks}</div>
        </div>`;
    }).join('');
  }

  function esc(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
