<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enter – Imperial Challenge 2027 | OS Archers</title>
  <meta name="description" content="Enter the 2027 Imperial Challenge from OS Archers.">
  <meta name="robots" content="index, follow">
  <meta name="author" content="OS Archers">
  <link rel="canonical" href="https://challenge.osarchers.co.uk/imperial/enter.html">
  <!-- Favicons -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;0,900;1,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="site-header"></div>

<!-- ─── PAGE BANNER ─── -->
<section class="page-banner">
  <div class="page-banner-inner">
    <div class="hero-eyebrow">OS Archers · Imperial · 2027</div>
    <h1>Enter the Imperial Challenge</h1>
    <p class="lead">Submit your entry details below to take part in the 2027 season.</p>
  </div>
</section>

<!-- ─── ENTRY FORM ─── -->
<section class="form-section">
  <div class="form-card">
    <form id="entryForm">
      <div class="form-row">
        <div class="form-group">
          <label for="firstName">First Name *</label>
          <input type="text" id="firstName" name="firstName" required>
        </div>
        <div class="form-group">
          <label for="lastName">Last Name *</label>
          <input type="text" id="lastName" name="lastName" required>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email Address *</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-group">
        <label for="postalAddress">Postal Address *</label>
        <textarea id="postalAddress" name="postalAddress" rows="3" required></textarea>
      </div>

      <div class="form-group">
        <label for="agbNumber">AGB Number *</label>
        <input type="text" id="agbNumber" name="agbNumber" required>
      </div>

      <div class="form-group">
        <label for="clubName">Club Name *</label>
        <input type="text" id="clubName" name="clubName" required>
      </div>

      <div class="form-group">
        <label class="checkbox-row">
          <input type="checkbox" id="gdprConsent" name="gdprConsent" required>
          <span>I agree to the collection and use of my data for this challenge. *</span>
        </label>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">Submit Entry</button>

      <div class="status-message success" id="successMessage">
        Entry submitted successfully. Thank you!
      </div>
      <div class="status-message error" id="errorMessage">
        Something went wrong. Please try again.
      </div>
    </form>
  </div>
</section>

<div id="site-footer"></div>

<script src="/js/includes.js"></script>
<script type="module">
  import { db } from '/js/firebase-config.js';
  import { collection, addDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

  const entryForm = document.getElementById('entryForm');
  const submitBtn = document.getElementById('submitBtn');
  const successMessage = document.getElementById('successMessage');
  const errorMessage = document.getElementById('errorMessage');

  entryForm.addEventListener('submit', async (event) => {
    event.preventDefault();

    successMessage.classList.remove('show');
    errorMessage.classList.remove('show');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting...';

    const entryData = {
      firstName: document.getElementById('firstName').value.trim(),
      lastName: document.getElementById('lastName').value.trim(),
      email: document.getElementById('email').value.trim(),
      postalAddress: document.getElementById('postalAddress').value.trim(),
      agbNumber: document.getElementById('agbNumber').value.trim(),
      clubName: document.getElementById('clubName').value.trim(),
      gdprConsent: document.getElementById('gdprConsent').checked,
      createdAt: serverTimestamp()
    };

    if (!entryData.gdprConsent) {
      errorMessage.textContent = 'Please confirm GDPR consent before submitting.';
      errorMessage.classList.add('show');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit Entry';
      return;
    }

    try {
      // TODO: flip to 'challengeEntries' (with roundType:'imperial', season:2027)
      // once the new Firestore rules are deployed — see firestore.rules.proposed.
      await addDoc(collection(db, 'imperialChallengeEntries'), entryData);
      entryForm.reset();
      successMessage.classList.add('show');
    } catch (error) {
      console.error('Firebase write failed:', error);
      errorMessage.classList.add('show');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit Entry';
    }
  });
</script>

</body>
</html>
